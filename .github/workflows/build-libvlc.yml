name: Build LibVLC for iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libvlc.yml'

jobs:
  build-libvlc:
    name: Build LibVLC Static Libraries (arm64)
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout VLC Source
        uses: actions/checkout@v4
        with:
          repository: 'videolan/vlc'
          ref: 'master'
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Dependencies
        run: |
          brew install automake autoconf libtool pkg-config gettext wget yasm nasm

      - name: Build LibVLC Static Binary for arm64
        run: |
          mkdir -p build-ios && cd build-ios
          ../extras/package/ios/build.sh -a arm64 -s "12.0" -d

      - name: Verify Build Output
        run: |
          ls -la build-ios/install-ios-arm64/lib/
          file build-ios/install-ios-arm64/lib/libvlc.a
          file build-ios/install-ios-arm64/lib/libvlccore.a

      - name: Upload Static Libraries
        uses: actions/upload-artifact@v4
        with:
          name: libvlc-ios-arm64
          path: |
            build-ios/install-ios-arm64/lib/*.a
            build-ios/install-ios-arm64/include/
          retention-days: 30

  build-ivlc:
    name: Build iVLC Binary
    runs-on: macos-14
    needs: build-libvlc
    timeout-minutes: 60

    steps:
      - name: Checkout iVLC Source
        uses: actions/checkout@v4

      - name: Download LibVLC Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libvlc-ios-arm64
          path: ./lib

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          echo "export THEOS=/opt/theos" >> ~/.bash_profile
          echo "export PATH=\$THEOS/bin:\$PATH" >> ~/.bash_profile
          source ~/.bash_profile

      - name: Build iVLC
        run: |
          export THEOS=/opt/theos
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          make clean all

      - name: Verify iVLC Binary
        run: |
          file ivlc
          ls -la ivlc

      - name: Upload iVLC Binary
        uses: actions/upload-artifact@v4
        with:
          name: ivlc-ios-arm64
          path: ivlc
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-libvlc, build-ivlc]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: libvlc-${{ github.run_number }}
          name: LibVLC iOS arm64 + iVLC Binary
          body: |
            Automated build of LibVLC static libraries and iVLC binary for iOS 12+ arm64.
            
            **Contents:**
            - `libvlc.a` - LibVLC static library
            - `libvlccore.a` - LibVLC core static library
            - `include/` - LibVLC headers
            - `ivlc` - iVLC media player binary
          files: |
            artifacts/libvlc-ios-arm64/*.a
            artifacts/libvlc-ios-arm64/include/
            artifacts/ivlc-ios-arm64/ivlc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}