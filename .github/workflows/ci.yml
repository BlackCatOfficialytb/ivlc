name: iVLC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: |
          clang-tidy main.c ytdlp_extract.c \
            -I./include \
            -std=c99 \
            --checks='*,-modernize-*,-cppcoreguidelines-*' \
            --warnings-as-errors='*' \
            2>&1 | head -50

  build-linux:
    name: Build Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvlc-dev libvlccore-dev

      - name: Build (Linux native test)
        run: |
          gcc -std=c99 -Wall -I./include \
            -o ivlc-test main.c ytdlp_extract.c \
            -lvlc -lvlccore -lm -ldl -lpthread

      - name: Verify Binary
        run: |
          file ivlc-test
          ./ivlc-test --help 2>&1 | head -5 || true

  build-ios-sim:
    name: Build Test (iOS Simulator)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install VLC via Homebrew (for headers/libs)
        run: |
          brew install vlc

      - name: Build for iOS Simulator (arm64)
        run: |
          SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          clang -std=c99 -Wall -I./include \
            -target arm64-apple-ios12.0-simulator \
            -isysroot "$SDKROOT" \
            -L/opt/homebrew/lib \
            -lvlc -lvlccore \
            -framework CoreGraphics -framework QuartzCore \
            -framework UIKit -framework Foundation \
            -framework VideoToolbox -framework Metal -framework AudioToolbox \
            -o ivlc-sim main.c ytdlp_extract.c

      - name: Verify Binary
        run: |
          file ivlc-sim
          lipo -info ivlc-sim